{% extends "base.html" %}

{% block title %}Create Sale{% endblock %}

{% block extra_css %}

<style>
    #sale-form > select,
    .product-search-input,
    .quantity {
        padding: 8px;
        margin-bottom: 10px;
    }

    #patient,
    #payment_method {
        width: 250px;
    }

    .sale-item {
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #ddd;
    }

    .product-search {
        margin-bottom: 10px;
    }

    .product-search-input {
        width: 350px;
        max-width: 100%;
    }

    .search-results {
        width: 350px;
        max-width: 100%;
        border: 1px solid #ccc;
        margin-top: -10px;
        margin-bottom: 10px;
    }

    .search-result {
        padding: 8px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
    }

    .search-result:hover {
        background-color: #f2f2f2;
    }

    .selected-drug,
    .drug-price,
    .drug-stock {
        display: inline-block;
        margin-right: 15px;
    }

    .quantity {
        width: 100px;
        display: block;
    }

    #total {
        font-weight: bold;
    }

    #message {
        margin-top: 15px;
    }
</style>

{% endblock %}

{% block content %}

<h1>Create Sale</h1>

<form id="sale-form">
    {% csrf_token %}

<h2>Patient</h2>

<select id="patient" required>
    <option value="">Select Patient</option>

    {% for patient in patients %}
        <option value="{{ patient.id }}">
            {{ patient }}
        </option>
    {% endfor %}
</select>

<h2>Payment Method</h2>

<select id="payment_method" required>
    <option value="">Select Payment Method</option>

    {% for value, label in payment_methods %}
        <option value="{{ value }}">
            {{ label }}
        </option>
    {% endfor %}
</select>

<h2>Sale Items</h2>

<div id="sale-items">
    <div class="sale-item">

        <div class="product-search">

            <input
                type="text"
                class="product-search-input"
                placeholder="Search drug name, generic name, brand, or barcode"
                autocomplete="off"
            >

            <div class="search-results"></div>

            <input type="hidden" class="drug">

            <span class="selected-drug">No drug selected</span>

            <span class="drug-price">Ksh 0.00</span>

            <span class="drug-stock">Stock: 0</span>

        </div>

        <input
            type="number"
            class="quantity"
            min="1"
            placeholder="Quantity"
            required
        >

        <button type="button" class="remove-item">
            Remove
        </button>

    </div>
</div>

<br>

<button type="button" id="add-item">
    Add Item
</button>

<h3>
    Total: Ksh <span id="total">0.00</span>
</h3>

<button type="submit">
    Create Sale
</button>


</form>

<p id="message"></p>

<script>
    const saleItemsContainer =
        document.getElementById("sale-items");

    const addItemButton =
        document.getElementById("add-item");

    const totalDisplay =
        document.getElementById("total");


    function updateTotal() {
        /*
         * Recalculate the sale total using the prices
         * of the products currently selected in the cart.
         */
        let total = 0;

        const saleItems =
            document.querySelectorAll(".sale-item");

        saleItems.forEach(function(item) {

            const drugInput =
                item.querySelector(".drug");

            const priceDisplay =
                item.querySelector(".drug-price");

            const quantityInput =
                item.querySelector(".quantity");

            if (!drugInput.value) {
                return;
            }

            const price =
                parseFloat(
                    priceDisplay.textContent
                        .replace("Ksh", "")
                        .trim()
                ) || 0;

            const quantity =
                parseInt(quantityInput.value || 0);

            total += price * quantity;
        });

        totalDisplay.textContent =
            total.toFixed(2);
    }


    async function searchProducts(input, resultsContainer, isCurrentSearch) {
        const query = input.value.trim();

        if (!query) {
            resultsContainer.innerHTML = "";
            return;
        }

        try {
            const response = await fetch(
                "/sales/api/products/search/?q=" +
                encodeURIComponent(query)
            );

            // Detect HTTP errors before processing the response.
            if (!response.ok) {
                throw new Error("Product search failed.");
            }

            const data = await response.json();

            // Ignore results from outdated searches.
            if (!isCurrentSearch()) {
                return;
            }

            if (!Array.isArray(data.products)) {
                throw new Error("Invalid server response.");
            }

            resultsContainer.innerHTML = "";

            if (data.products.length === 0) {
                resultsContainer.textContent =
                    "No matching in-stock drugs found.";
                return;
            }

            if (
                data.products.length === 1 &&
                data.products[0].barcode === query
            ) {
                selectProduct(input, resultsContainer, data.products[0]);
                return;
            }

            data.products.forEach(function(product) {
                const result = document.createElement("div");

                result.textContent =
                    product.name +
                    " - Ksh " +
                    product.price +
                    " (Stock: " +
                    product.stock +
                    ")";

                result.className = "search-result";

                result.addEventListener("click", function() {
                    selectProduct(input, resultsContainer, product);
                });

                resultsContainer.appendChild(result);
            });

        } catch (error) {
            if (!isCurrentSearch()) {
                return;
            }

            console.error("Product search error:", error);

            resultsContainer.textContent =
                "Unable to search products. Please try again.";
        }
    }

    //product selection helper, it removes duplicated product-selection code from the search function.
    function selectProduct(input, resultsContainer, product) {
        const saleItem = input.closest(".sale-item");

        saleItem.querySelector(".drug").value = product.id;

        saleItem.querySelector(".selected-drug").textContent =
            product.name;

        saleItem.querySelector(".drug-price").textContent =
            "Ksh " + product.price;

        saleItem.querySelector(".drug-stock").textContent =
            "Stock: " + product.stock;

        input.value = "";
        resultsContainer.innerHTML = "";

        updateTotal();
    }


    function attachItemEvents(item) {
        /*
         * Attach search, quantity, and remove events
         * to one sale item in the cart.
         */
        const searchInput =
            item.querySelector(".product-search-input");

        const searchResults =
            item.querySelector(".search-results");

        const quantityInput =
            item.querySelector(".quantity");

        const removeButton =
            item.querySelector(".remove-item");


        let debounceTimer = null;
        let searchRequestId = 0;

        searchInput.addEventListener("input", function() {

            clearTimeout(debounceTimer);

            // Invalidate any previous search request.
            searchRequestId++;

            const currentRequestId = searchRequestId;

            if (!searchInput.value.trim()) {
                searchResults.innerHTML = "";
                return;
            }

            searchResults.textContent = "Searching...";

            debounceTimer = setTimeout(function() {

                searchProducts(
                    searchInput,
                    searchResults,
                    function() {
                        return currentRequestId === searchRequestId;
                    }
                );

            }, 300);
        });


        quantityInput.addEventListener(
            "input",
            updateTotal
        );


        removeButton.addEventListener(
            "click",
            function() {

                const items =
                    document.querySelectorAll(".sale-item");

                if (items.length === 1) {

                    alert(
                        "A sale must contain at least one item."
                    );

                    return;
                }

                item.remove();

                updateTotal();
            }
        );
    }


    attachItemEvents(
        document.querySelector(".sale-item")
    );


    addItemButton.addEventListener(
        "click",
        function() {

            const firstItem =
                document.querySelector(".sale-item");

            const newItem =
                firstItem.cloneNode(true);


            newItem.querySelector(
                ".product-search-input"
            ).value = "";

            newItem.querySelector(
                ".search-results"
            ).innerHTML = "";

            newItem.querySelector(
                ".drug"
            ).value = "";

            newItem.querySelector(
                ".selected-drug"
            ).textContent =
                "No drug selected";

            newItem.querySelector(
                ".drug-price"
            ).textContent =
                "Ksh 0.00";

            newItem.querySelector(
                ".drug-stock"
            ).textContent =
                "Stock: 0";

            newItem.querySelector(
                ".quantity"
            ).value = "";


            saleItemsContainer.appendChild(newItem);

            attachItemEvents(newItem);

            updateTotal();
        }
    );


        
    let isSubmitting = false;

    document.getElementById("sale-form").addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            // Prevent duplicate submissions.
            if (isSubmitting) {
                return;
            }

            const message = document.getElementById("message");
            const form = event.currentTarget;

            const submitButton = form.querySelector(
                'button[type="submit"], input[type="submit"]'
            );

            const patient =
                document.getElementById("patient").value;

            const paymentMethod =
                document.getElementById("payment_method").value;

            const saleItems =
                document.querySelectorAll(".sale-item");

            const items = [];

            saleItems.forEach(function(item) {

                const drug =
                    item.querySelector(".drug").value;

                const quantity =
                    item.querySelector(".quantity").value;

                if (drug && quantity) {
                    items.push({
                        drug_id: drug,
                        quantity: quantity
                    });
                }
            });

            if (items.length === 0) {
                message.textContent =
                    "Please add at least one sale item.";
                return;
            }

            const csrfInput = form.querySelector(
                "[name=csrfmiddlewaretoken]"
            );

            if (!csrfInput) {
                message.textContent =
                    "Security token missing. Please refresh the page.";
                return;
            }

            const csrfToken = csrfInput.value;

            isSubmitting = true;

            if (submitButton) {
                submitButton.disabled = true;

                if (submitButton.tagName === "BUTTON") {
                    submitButton.textContent = "Processing...";
                } else {
                    submitButton.value = "Processing...";
                }
            }

            message.textContent = "Creating sale...";

            try {

                const response = await fetch(
                    "/sales/api/create/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": csrfToken
                        },

                        body: JSON.stringify({
                            patient: patient,
                            payment_method: paymentMethod,
                            items: items
                        })
                    }
                );

                // Verify that the server returned JSON.
                const contentType =
                    response.headers.get("content-type") || "";

                if (!contentType.includes("application/json")) {
                    throw new Error(
                        "The server returned an unexpected response. Please try again."
                    );
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Unable to create sale."
                    );
                }

                if (!data.sale_id) {
                    throw new Error(
                        "Sale response is missing the sale ID."
                    );
                }

                message.textContent = "Sale created successfully.";

                window.location.href =
                    "/sales/" + data.sale_id + "/";

            } catch (error) {

                console.error("Sale creation error:", error);

                message.textContent =
                    error.message ||
                    "A network error occurred. Please try again.";

                // Allow another attempt after failure.
                isSubmitting = false;

                if (submitButton) {
                    submitButton.disabled = false;

                    if (submitButton.tagName === "BUTTON") {
                        submitButton.textContent = "Create Sale";
                    } else {
                        submitButton.value = "Create Sale";
                    }
                }
            }
        }
    );

</script>

{% endblock %}
