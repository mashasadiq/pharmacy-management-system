{% extends "base.html" %}

{% block title %}Create Sale{% endblock %}

{% block extra_css %}

<style>
    #sale-form > select,
    .product-search-input,
    .quantity {
        padding: 8px;
        margin-bottom: 10px;
    }

    #patient,
    #payment_method {
        width: 250px;
    }

    .sale-item {
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #ddd;
    }

    .product-search {
        margin-bottom: 10px;
    }

    .product-search-input {
        width: 350px;
        max-width: 100%;
    }

    .search-results {
        width: 350px;
        max-width: 100%;
        border: 1px solid #ccc;
        margin-top: -10px;
        margin-bottom: 10px;
    }

    .search-result {
        padding: 8px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
    }

    .search-result:hover {
        background-color: #f2f2f2;
    }

    .selected-drug,
    .drug-price,
    .drug-stock {
        display: inline-block;
        margin-right: 15px;
    }

    .quantity {
        width: 100px;
        display: block;
    }

    #total {
        font-weight: bold;
    }

    #message {
        margin-top: 15px;
    }
</style>

{% endblock %}

{% block content %}

<h1>Create Sale</h1>

<form id="sale-form">
    {% csrf_token %}

<h2>Patient</h2>

<select id="patient" required>
    <option value="">Select Patient</option>

    {% for patient in patients %}
        <option value="{{ patient.id }}">
            {{ patient }}
        </option>
    {% endfor %}
</select>

<h2>Payment Method</h2>

<select id="payment_method" required>
    <option value="">Select Payment Method</option>

    {% for value, label in payment_methods %}
        <option value="{{ value }}">
            {{ label }}
        </option>
    {% endfor %}
</select>

<h2>Sale Items</h2>

<div id="sale-items">
    <div class="sale-item">

        <div class="product-search">

            <input
                type="text"
                class="product-search-input"
                placeholder="Search drug name, generic name, brand, or barcode"
                autocomplete="off"
            >

            <div class="search-results"></div>

            <input type="hidden" class="drug">

            <span class="selected-drug">No drug selected</span>

            <span class="drug-price">Ksh 0.00</span>

            <span class="drug-stock">Stock: 0</span>

        </div>

        <input
            type="number"
            class="quantity"
            min="1"
            placeholder="Quantity"
            required
        >

        <button type="button" class="remove-item">
            Remove
        </button>

    </div>
</div>

<br>

<button type="button" id="add-item">
    Add Item
</button>

<h3>
    Total: Ksh <span id="total">0.00</span>
</h3>

<button type="submit">
    Create Sale
</button>


</form>

<p id="message"></p>

<script>
    const saleItemsContainer =
        document.getElementById("sale-items");

    const addItemButton =
        document.getElementById("add-item");

    const totalDisplay =
        document.getElementById("total");


    function updateTotal() {
        /*
         * Recalculate the sale total using the prices
         * of the products currently selected in the cart.
         */
        let total = 0;

        const saleItems =
            document.querySelectorAll(".sale-item");

        saleItems.forEach(function(item) {

            const drugInput =
                item.querySelector(".drug");

            const priceDisplay =
                item.querySelector(".drug-price");

            const quantityInput =
                item.querySelector(".quantity");

            if (!drugInput.value) {
                return;
            }

            const price =
                parseFloat(
                    priceDisplay.textContent
                        .replace("Ksh", "")
                        .trim()
                ) || 0;

            const quantity =
                parseInt(quantityInput.value || 0);

            total += price * quantity;
        });

        totalDisplay.textContent =
            total.toFixed(2);
    }


    async function searchProducts(input, resultsContainer) {
        /*
         * Search the database for matching products
         * and display the results for the current cart item.
         */
        const query =
            input.value.trim();

        resultsContainer.innerHTML = "";

        if (!query) {
            return;
        }

        const response =
            await fetch(
                "/sales/api/products/search/?q=" +
                encodeURIComponent(query)
            );

        const data =
            await response.json();

        if (data.products.length === 1 &&
            data.products[0].barcode === query) {

            const product = data.products[0];

            const saleItem =
                input.closest(".sale-item");

            saleItem.querySelector(
                ".drug"
            ).value = product.id;

            saleItem.querySelector(
                ".selected-drug"
            ).textContent =
                product.name;

            saleItem.querySelector(
                ".drug-price"
            ).textContent =
                "Ksh " + product.price;

            saleItem.querySelector(
                ".drug-stock"
            ).textContent =
                "Stock: " + product.stock;

            input.value = "";

            resultsContainer.innerHTML = "";

            updateTotal();

            return;
        }

        data.products.forEach(function(product) {

            const result =
                document.createElement("div");

            result.textContent =
                product.name +
                " - Ksh " +
                product.price +
                " (Stock: " +
                product.stock +
                ")";

            result.className =
                "search-result";

            result.addEventListener(
                "click",
                function() {

                    const saleItem =
                        input.closest(".sale-item");

                    saleItem.querySelector(
                        ".drug"
                    ).value = product.id;

                    saleItem.querySelector(
                        ".selected-drug"
                    ).textContent =
                        product.name;

                    saleItem.querySelector(
                        ".drug-price"
                    ).textContent =
                        "Ksh " + product.price;

                    saleItem.querySelector(
                        ".drug-stock"
                    ).textContent =
                        "Stock: " + product.stock;

                    input.value = "";

                    resultsContainer.innerHTML = "";

                    updateTotal();
                }
            );

            resultsContainer.appendChild(result);
        });
    }


    function attachItemEvents(item) {
        /*
         * Attach search, quantity, and remove events
         * to one sale item in the cart.
         */
        const searchInput =
            item.querySelector(".product-search-input");

        const searchResults =
            item.querySelector(".search-results");

        const quantityInput =
            item.querySelector(".quantity");

        const removeButton =
            item.querySelector(".remove-item");


        searchInput.addEventListener(
            "input",
            function() {

                searchProducts(
                    searchInput,
                    searchResults
                );
            }
        );


        quantityInput.addEventListener(
            "input",
            updateTotal
        );


        removeButton.addEventListener(
            "click",
            function() {

                const items =
                    document.querySelectorAll(".sale-item");

                if (items.length === 1) {

                    alert(
                        "A sale must contain at least one item."
                    );

                    return;
                }

                item.remove();

                updateTotal();
            }
        );
    }


    attachItemEvents(
        document.querySelector(".sale-item")
    );


    addItemButton.addEventListener(
        "click",
        function() {

            const firstItem =
                document.querySelector(".sale-item");

            const newItem =
                firstItem.cloneNode(true);


            newItem.querySelector(
                ".product-search-input"
            ).value = "";

            newItem.querySelector(
                ".search-results"
            ).innerHTML = "";

            newItem.querySelector(
                ".drug"
            ).value = "";

            newItem.querySelector(
                ".selected-drug"
            ).textContent =
                "No drug selected";

            newItem.querySelector(
                ".drug-price"
            ).textContent =
                "Ksh 0.00";

            newItem.querySelector(
                ".drug-stock"
            ).textContent =
                "Stock: 0";

            newItem.querySelector(
                ".quantity"
            ).value = "";


            saleItemsContainer.appendChild(newItem);

            attachItemEvents(newItem);

            updateTotal();
        }
    );


    document.getElementById("sale-form").addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const patient =
                document.getElementById("patient").value;


            const paymentMethod =
                document.getElementById("payment_method").value;


            const saleItems =
                document.querySelectorAll(".sale-item");


            const items = [];


            saleItems.forEach(function(item) {

                const drug =
                    item.querySelector(".drug").value;


                const quantity =
                    item.querySelector(".quantity").value;


                if (drug && quantity) {

                    items.push({
                        drug_id: drug,
                        quantity: quantity
                    });
                }
            });


            if (items.length === 0) {

                document.getElementById("message").textContent =
                    "Please add at least one sale item.";

                return;
            }


            const csrfToken =
                document.querySelector(
                    "[name=csrfmiddlewaretoken]"
                ).value;


            const response =
                await fetch(
                    "/sales/api/create/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": csrfToken
                        },

                        body: JSON.stringify({
                            patient: patient,
                            payment_method: paymentMethod,
                            items: items
                        })
                    }
                );


            const data =
                await response.json();


            const message =
                document.getElementById("message");


            if (response.ok) {

                window.location.href =
                    "/sales/" + data.sale_id + "/";

            } else {

                message.textContent =
                    "Error: " + data.error;
            }
        }
    );
</script>

{% endblock %}
