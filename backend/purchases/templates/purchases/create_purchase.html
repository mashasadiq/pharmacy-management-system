<!DOCTYPE html>

<html>
<head>
    <title>Record Purchase</title>
</head>
<body>

<h1>Record Purchase</h1>

<form id="purchase-form">
    {% csrf_token %}

    <h2>Drug</h2>

    <select id="drug" required>
        <option value="">Select Drug</option>

        {% for drug in drugs %}
            <option value="{{ drug.id }}">
                {{ drug.name }} - Current Stock: {{ drug.quantity_in_stock }}
            </option>
        {% endfor %}
    </select>

    <h2>Supplier</h2>

    <select id="supplier" required>
        <option value="">Select Supplier</option>

        {% for supplier in suppliers %}
            <option value="{{ supplier.id }}">
                {{ supplier.company_name }}
            </option>
        {% endfor %}
    </select>

    <h2>Quantity</h2>

    <input
        type="number"
        id="quantity"
        min="1"
        placeholder="Quantity received"
        required
    >

    <h2>Cost Price</h2>

    <input
        type="number"
        id="cost_price"
        min="0"
        step="0.01"
        placeholder="Cost price per unit"
        required
    >

    <h2>Purchase Date</h2>

    <input
        type="date"
        id="purchase_date"
        required
    >

    <h2>Invoice Number</h2>

    <input
        type="text"
        id="invoice_number"
        placeholder="Invoice number"
        required
    >

    <h2>Remarks</h2>

    <textarea
        id="remarks"
        placeholder="Optional remarks"
    ></textarea>

    <br><br>

    <button type="submit">
        Record Purchase
    </button>

</form>

<p id="message"></p>


<script>
    document.getElementById("purchase-form").addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const drug =
                document.getElementById("drug").value;

            const supplier =
                document.getElementById("supplier").value;

            const quantity =
                document.getElementById("quantity").value;

            const costPrice =
                document.getElementById("cost_price").value;

            const purchaseDate =
                document.getElementById("purchase_date").value;

            const invoiceNumber =
                document.getElementById("invoice_number").value;

            const remarks =
                document.getElementById("remarks").value;

            const csrfToken =
                document.querySelector(
                    "[name=csrfmiddlewaretoken]"
                ).value;

            const response = await fetch(
                "/purchases/api/create/",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify({
                        drug_id: drug,
                        supplier_id: supplier,
                        quantity: quantity,
                        cost_price: costPrice,
                        purchase_date: purchaseDate,
                        invoice_number: invoiceNumber,
                        remarks: remarks
                    })
                }
            );

            const data = await response.json();

            const message =
                document.getElementById("message");

            if (response.ok) {
                message.textContent =
                    "Purchase recorded successfully. " +
                    "Purchase #" + data.purchase_id +
                    " created. New stock: " +
                    data.new_stock;
            } else {
                message.textContent =
                    "Error: " + data.error;
            }
        }
    );
</script>

</body>
</html>
