{% extends "base.html" %}

{% block title %}Record Purchase{% endblock %}

{% block extra_css %}
<style>
    .purchase-container {
        max-width: 750px;
    }

    .purchase-section {
        margin-bottom: 22px;
    }

    .purchase-section h2 {
        font-size: 16px;
        margin-bottom: 10px;
    }

    .purchase-section select,
    .purchase-section input,
    .purchase-section textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d5dde3;
        border-radius: 6px;
        font: inherit;
    }

    .purchase-section textarea {
        min-height: 90px;
        resize: vertical;
    }

    .purchase-section select:focus,
    .purchase-section input:focus,
    .purchase-section textarea:focus {
        outline: none;
        border-color: #087e70;
    }

    .purchase-button {
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        background: #087e70;
        color: white;
        cursor: pointer;
        font-weight: 600;
    }

    .purchase-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #message {
        margin-top: 18px;
        padding: 12px;
        border-radius: 6px;
    }
</style>
{% endblock %}

{% block content %}

<div class="purchase-container">

    <h1>Record Purchase</h1>

    <form id="purchase-form">
        {% csrf_token %}

        <div class="purchase-section">
            <h2>Drug</h2>

            <select id="drug" required>
                <option value="">Select Drug</option>

                {% for drug in drugs %}
                    <option value="{{ drug.id }}">
                        {{ drug.name }} - Current Stock: {{ drug.quantity_in_stock }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="purchase-section">
            <h2>Supplier</h2>

            <select id="supplier" required>
                <option value="">Select Supplier</option>

                {% for supplier in suppliers %}
                    <option value="{{ supplier.id }}">
                        {{ supplier.company_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="purchase-section">
            <h2>Quantity</h2>

            <input
                type="number"
                id="quantity"
                min="1"
                placeholder="Quantity received"
                required
            >
        </div>

        <div class="purchase-section">
            <h2>Cost Price</h2>

            <input
                type="number"
                id="cost_price"
                min="0"
                step="0.01"
                placeholder="Cost price per unit"
                required
            >
        </div>

        <div class="purchase-section">
            <h2>Purchase Date</h2>

            <input
                type="date"
                id="purchase_date"
                required
            >
        </div>

        <div class="purchase-section">
            <h2>Supplier Invoice Number (Optional)</h2>

            <input
                type="text"
                id="invoice_number"
                placeholder="Enter supplier invoice number if available"
            >
        </div>

        <div class="purchase-section">
            <h2>Remarks</h2>

            <textarea
                id="remarks"
                placeholder="Optional remarks"
            ></textarea>
        </div>

        <button
            type="submit"
            id="record-purchase-btn"
            class="purchase-button"
        >
            Record Purchase
        </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

</div>


<script>
    // Keep the current purchase key across retries and page refreshes.
    const storageKey = "pending_purchase_idempotency_key";

    // Retrieves the existing key or creates one if none exists.
    function getPurchaseKey() {
        let key = sessionStorage.getItem(storageKey);

        if (!key) {
            key = crypto.randomUUID();
            sessionStorage.setItem(storageKey, key);
        }

        return key;
    }

    // Creates a fresh key after a confirmed purchase.
    function generateNewPurchaseKey() {
        const key = crypto.randomUUID();
        sessionStorage.setItem(storageKey, key);
        return key;
    }

    // Submit a purchase and prevent duplicate submissions.
    document.getElementById("purchase-form").addEventListener(
        "submit",
        async function(event) {
            event.preventDefault();

            const form = event.currentTarget;
            const button = document.getElementById("record-purchase-btn");
            const message = document.getElementById("message");

            if (button.disabled) {
                return;
            }

            const drug = document.getElementById("drug").value;
            const supplier = document.getElementById("supplier").value;
            const quantity = document.getElementById("quantity").value;
            const costPrice = document.getElementById("cost_price").value;
            const purchaseDate = document.getElementById("purchase_date").value;
            const invoiceNumber = document.getElementById("invoice_number").value;
            const remarks = document.getElementById("remarks").value;

            const csrfToken = document.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value;

            // Reuse this key if the previous request needs retrying.
            const idempotencyKey = getPurchaseKey();

            button.disabled = true;
            button.textContent = "Recording Purchase...";
            message.textContent = "Please wait while the purchase is recorded.";

            try {
                const response = await fetch("/purchases/api/create/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify({
                        drug_id: drug,
                        supplier_id: supplier,
                        quantity: quantity,
                        cost_price: costPrice,
                        purchase_date: purchaseDate,
                        invoice_number: invoiceNumber,
                        remarks: remarks,
                        idempotency_key: idempotencyKey
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    message.textContent =
                        "Purchase failed: " + (data.error || "Please try again.");
                    return;
                }

                message.textContent =
                    data.message +
                    " | Purchase reference: " + data.purchase_reference +
                    " | Supplier invoice: " +
                        (data.supplier_invoice_number || "Not provided") +
                    " | Drug: " + data.drug +
                    " | Quantity received: " + data.quantity +
                    " | Updated stock: " + data.new_stock;

                // Reset the form only after confirmed success.
                form.reset();

                // A confirmed purchase is complete. Prepare a fresh key.
                generateNewPurchaseKey();

            } catch (error) {
                // Keep the same key because the server may have saved the purchase.
                message.textContent =
                    "Unable to confirm the purchase. Retry using the same form " +
                    "to avoid recording it twice.";
            } finally {
                button.disabled = false;
                button.textContent = "Record Purchase";
            }
        }
    );
</script>

{% endblock %}
