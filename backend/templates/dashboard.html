{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block extra_css %}
    <style>
        /* Dashboard-specific layout and component styles. */

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .dashboard-card h3 {
            margin-top: 0;
            color: #6b7280;
            font-size: 16px;
        }

        .dashboard-card p {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0 0;
            color: #1f2937;
        }

        .dashboard-card a {
            text-decoration: none;
        }

        .dashboard-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-bottom: 30px;
        }

        .dashboard-table th,
        .dashboard-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .dashboard-table th {
            background: #f9fafb;
            color: #374151;
        }

        .dashboard-table tr:hover {
            background: #f9fafb;
        }

        .action-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .action-button {
            display: inline-block;
            background: #1f2937;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
        }

        .action-button:hover {
            opacity: 0.9;
        }
    </style>
{% endblock %}

{% block content %}

    <div class="dashboard-container">

        {% block dashboard_content %}
        {% endblock %}

    </div>

{% endblock %}
